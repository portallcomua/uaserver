<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UAServer - Старт</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }
        .btn-start {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s;
            margin: 20px 0;
        }
        .btn-start:hover {
            transform: scale(1.05);
            background: #45a049;
        }
        .ad-block {
            background: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 15px;
            margin: 20px 0;
        }
        footer {
            font-size: 12px;
            color: #999;
            margin-top: 20px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🚀 UAServer</h1>
    <div class="subtitle">Локальний сервер для веб-розробників</div>
    
    <!-- РЕКЛАМНИЙ БЛОК -->
    <div class="ad-block">
        <strong>📢 Реклама</strong><br>
        <a href="https://your-advertiser.com" target="_blank">Ваш банер тут</a>
    </div>
    
    <!-- КНОПКА -->
    <button class="btn-start" onclick="openLocalhost()">🌍 ВІДКРИТИ LOCALHOST</button>
    
    <footer>
        Сервер вже запущено!<br>
        Натисніть кнопку, щоб відкрити ваш сайт
    </footer>
</div>

<script>
    function openLocalhost() {
        // Відкриваємо localhost:8080 (або 80 якщо порт вільний)
        window.open('http://localhost:8080', '_blank');
        // Якщо не відкрилось, пробуємо 80
        setTimeout(() => {
            window.open('http://localhost', '_blank');
        }, 500);
    }
    
    // Відкриття всіх зовнішніх посилань в новій вкладці
    document.querySelectorAll('a').forEach(link => {
        link.setAttribute('target', '_blank');
    });
</script>
</body>
</html>
