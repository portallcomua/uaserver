name: Mark UAServer portable build as latest

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/promote-latest.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Mark verified portable package as latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit v8.5.1-portable-test-20261127-j --repo portallcomua/uaserver --latest
