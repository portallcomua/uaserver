[client]
port=3306
default-character-set=utf8mb4
[mysql]
default-character-set=utf8mb4
[mysqld]
port=3306
basedir='D:/UaServer/bin/mysql'
datadir='D:/UaServer/bin/mysql/data'
tmpdir='D:/UaServer/tmp'
socket='D:/UaServer/bin/mysql/mysql.sock'
pid-file='D:/UaServer/bin/mysql/mysql.pid'
character-set-server=utf8mb4
collation-server=utf8mb4_unicode_ci
init-connect='SET NAMES utf8mb4'
max_connections=60
key_buffer_size=64M
max_allowed_packet=500M
tmp_table_size=64M
max_heap_table_size=64M
default_storage_engine=InnoDB
innodb_buffer_pool_size=512M
innodb_log_buffer_size=16M
innodb_flush_log_at_trx_commit=2
innodb_lock_wait_timeout=50
innodb_io_capacity=1000
log_error='D:/UaServer/logs/mysql_error.log'
explicit_defaults_for_timestamp=true
sql_mode=NO_ENGINE_SUBSTITUTION
