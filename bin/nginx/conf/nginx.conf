worker_processes auto; 
events { worker_connections 1024; } 
http { 
    include mime.types; 
    default_type application/octet-stream; 
    charset utf-8; 
    client_max_body_size 1024M; 
    sendfile on; 
    tcp_nopush on; 
    tcp_nodelay on; 
    keepalive_timeout 65; 
    client_header_timeout 1800; 
    client_body_timeout 1800; 
    send_timeout 1800; 
    server { 
        listen 80; 
        server_name localhost; 
        root 'D:/UaServer/www'; 
        index index.php index.html index.htm; 
        autoindex on; 
        location / { 
            try_files $uri $uri/ /index.php?$args; 
        } 

        # Динамічний блок для сайту: demos.zp.ua 
        location /demos.zp.ua { 
            try_files $uri $uri/ /demos.zp.ua/index.php?$args; 
        } 

        # Динамічний блок для сайту: pumpblower.biz.ua 
        location /pumpblower.biz.ua { 
            try_files $uri $uri/ /pumpblower.biz.ua/index.php?$args; 
        } 

        location ^~ /phpmyadmin { 
            alias 'D:/UaServer/bin/phpmyadmin'; 
            index index.php; 
            client_max_body_size 1024M; 
            location ~ \.php$ { 
                fastcgi_pass 127.0.0.1:9000; 
                fastcgi_index index.php; 
                fastcgi_param SCRIPT_FILENAME $request_filename; 
                include fastcgi_params; 
            } 
        } 
        location ~ \.php$ { 
            fastcgi_pass 127.0.0.1:9000; 
            fastcgi_index index.php; 
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name; 
            include fastcgi_params; 
            fastcgi_read_timeout 1800; 
            fastcgi_buffers 16 16k; 
            fastcgi_buffer_size 32k; 
            # ФІКС: Жорстко забороняємо PHP виводити помилки на екран, ігноруючи налаштування рушіїв 
            fastcgi_param PHP_VALUE 'display_errors=Off 
 error_reporting=0'; 
        } 
    } 
}